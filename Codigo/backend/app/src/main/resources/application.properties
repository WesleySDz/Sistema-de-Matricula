spring.application.name=matricula-mais

# Mantém os cadastros e os números de matrícula emitidos após reiniciar.
app.data-dir=${MATRICULA_DATA_DIR:./data}
spring.datasource.url=jdbc:h2:file:${app.data-dir}/matricula-mais;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false
server.servlet.session.timeout=30m

# Sem URL, as notificações ficam pendentes até a configuração do sistema externo.
app.cobranca.url=${COBRANCA_URL:}
app.cobranca.intervalo-ms=30000

# Criação opcional da primeira conta da secretaria, sem credenciais padrão.
app.secretaria.login=${SECRETARIA_LOGIN:}
app.secretaria.senha=${SECRETARIA_SENHA:}
